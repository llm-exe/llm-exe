name: Release / Publish

on:
  workflow_dispatch:

  release:
    types:
      - published

permissions:
  id-token: write
  contents: write

jobs:
  check-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if release is from main branch
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          BRANCH=$(jq -r .release.target_commitish "$GITHUB_EVENT_PATH")
          if [ "$BRANCH" != "main" ]; then
            echo "Releases should only be created from the main branch. This release is from $BRANCH."
            exit 1
          fi

  run-examples-tests:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: check-release-branch
    name: Run Examples Tests
    runs-on: ubuntu-latest
    environment: Examples Test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v6

      - name: Use Latest Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"

      - name: Cache npm dependencies
        uses: ./.github/actions/cache

      - name: Install dependencies
        run: npm install

      - name: Build package and pack package
        run: npm run build:package && npm pack

      - name: Copy path of packed package
        run: |
          echo "PACKED_PACKAGE_PATH=$(find . -maxdepth 1 -type f -name 'llm-exe-*.tgz')" >> $GITHUB_ENV

      - name: Extract tarball and replace dist folder
        run: |
          mkdir -p temp_extract
          tar -xzf ${{ env.PACKED_PACKAGE_PATH }} -C temp_extract
          rm -rf dist
          cp -r temp_extract/package/dist .
          rm -rf temp_extract

      - name: Install dependencies in examples directory
        run: cd examples && npm install

      - name: Run examples tests
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096 --experimental-vm-modules"
          npm run test-examples

  publish-npm-package:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: [check-release-branch, run-examples-tests]
    name: Publish Main/Beta Package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Publisher
        run: |
          ALLOWED_PUBLISHERS="gregreindel"
          if [[ ! ",$ALLOWED_PUBLISHERS," =~ ",${{ github.actor }}," ]]; then
            echo "Error: User ${{ github.actor }} is not authorized to publish packages"
            echo "Allowed publishers: $ALLOWED_PUBLISHERS"
            exit 1
          fi
          echo "User ${{ github.actor }} is authorized to publish"

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node

      - name: Cache npm dependencies
        uses: ./.github/actions/cache

      - name: Install
        run: npm install

      - name: Build package
        run: npm run build:package

      - name: Publish Main/Beta Package version
        id: npm-publish
        run: |
          version=$(node -p "require('./package.json').version")
          # Semver pre-release: anything after a "-" (e.g. 3.0.0-beta.0, 3.0.0-rc.1, 3.0.0-alpha.2).
          # The channel name is the first alphabetic chunk after the "-" and becomes the npm dist-tag.
          # If the version has a "-" but no alphabetic channel (e.g. 3.0.0-1234), refuse to publish —
          # otherwise we'd silently push the pre-release to the "latest" dist-tag.
          if [[ "$version" == *-* ]]; then
            if [[ "$version" =~ -([a-zA-Z]+) ]]; then
              TAG="${BASH_REMATCH[1]}"
              echo "Publishing pre-release version $version with npm dist-tag: $TAG"
              npm publish --provenance --tag "$TAG"
            else
              echo "Error: pre-release version $version has no alphabetic channel (expected -beta.X, -rc.X, -alpha.X, etc.)"
              echo "Refusing to publish to avoid clobbering the 'latest' npm dist-tag."
              exit 1
            fi
          else
            echo "Publishing main version $version"
            npm run publish-main
          fi

  # Reverts the GitHub release back to draft if examples tests or npm publish fail.
  # Runs after both jobs complete (in any state) so it catches failures from either.
  revert-to-draft:
    if: |
      always() &&
      github.event_name == 'release' &&
      (needs.run-examples-tests.result == 'failure' || needs.publish-npm-package.result == 'failure')
    needs: [run-examples-tests, publish-npm-package]
    name: Revert Release to Draft
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Revert release to draft
        run: |
          RELEASE_ID=$(jq -r .release.id "$GITHUB_EVENT_PATH")
          ORIGINAL_BODY=$(jq -r .release.body "$GITHUB_EVENT_PATH")

          if [ "${{ needs.run-examples-tests.result }}" = "failure" ]; then
            FAILURE_REASON="the examples tests failed before publishing"
          else
            FAILURE_REASON="the package failed to publish to npm"
          fi

          echo "Reverting release ID $RELEASE_ID to draft — reason: $FAILURE_REASON"

          cat > release_body.txt <<'EOF'
          > [!WARNING]
          > **Release Publishing Failed**
          > This release has been automatically reverted to draft status because FAILURE_REASON.
          > Please review the [workflow logs](WORKFLOW_URL) and address any issues before attempting to publish again.
          ---
          EOF
          sed -i "s|FAILURE_REASON|$FAILURE_REASON|g" release_body.txt
          sed -i "s|WORKFLOW_URL|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" release_body.txt
          echo "$ORIGINAL_BODY" >> release_body.txt

          BODY_JSON=$(jq -Rs '.' < release_body.txt)
          response=$(curl -s -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.bot-token.outputs.token }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID \
            -d "{\"draft\": true, \"body\": ${BODY_JSON}}")
          if echo "$response" | jq -e '.id' > /dev/null; then
            echo "✅ Release reverted to draft with original notes preserved"
          else
            echo "⚠️  Warning: Failed to revert release"
            echo "$response" | jq '.'
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Delete release tag
        run: |
          TAG_NAME=$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")
          echo "Deleting git tag: $TAG_NAME"
          if gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME deleted — version bump logic will no longer treat this version as released"
          else
            echo "Could not delete tag $TAG_NAME"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Revert version bump in development and update draft PR title
        run: |
          TAG_NAME=$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")
          FAILED_VERSION="${TAG_NAME#v}"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin development

          CURRENT_DEV_VERSION=$(git show origin/development:package.json | jq -r '.version')
          echo "Failed version: $FAILED_VERSION | Current version on development: $CURRENT_DEV_VERSION"

          if [ "$CURRENT_DEV_VERSION" != "$FAILED_VERSION" ]; then
            echo "development was bumped to v$CURRENT_DEV_VERSION after the failed release — reverting to v$FAILED_VERSION"

            git checkout -b revert-version-bump origin/development
            jq --arg v "$FAILED_VERSION" '.version = $v' package.json > package.tmp && mv package.tmp package.json
            git add package.json
            git commit -m "chore: revert version bump after failed publish of v$FAILED_VERSION"
            git push origin revert-version-bump --force

            EXISTING=$(gh pr list --state open --head revert-version-bump --base development --json number --jq '.[0].number')
            if [ -z "$EXISTING" ]; then
              gh pr create \
                --title "chore: revert version bump after failed publish of v$FAILED_VERSION" \
                --body "The v$FAILED_VERSION publish failed. Reverting package.json so the next release attempt re-uses v$FAILED_VERSION." \
                --base development \
                --head revert-version-bump
            fi

            REVERT_PR=$(gh pr list --state open --head revert-version-bump --base development --json number --jq '.[0].number')
            gh pr merge "$REVERT_PR" --admin --squash --delete-branch --repo ${{ github.repository }}
            echo "development reverted to v$FAILED_VERSION"
          else
            echo "development already at v$FAILED_VERSION — no version revert needed"
          fi

          # Update the draft dev→main PR title immediately (draft-main-pr.yml will also
          # update it when the revert PR merges, but this ensures it happens right away)
          EXPECTED_TITLE="Draft PR for release version v$FAILED_VERSION"
          PR_INFO=$(gh pr list --base main --head development --state open --json number,title --jq '.[0]')
          if [ -n "$PR_INFO" ] && [ "$PR_INFO" != "null" ]; then
            PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
            PR_TITLE=$(echo "$PR_INFO" | jq -r '.title')
            if [ "$PR_TITLE" != "$EXPECTED_TITLE" ]; then
              gh pr edit "$PR_NUMBER" --title "$EXPECTED_TITLE" --repo ${{ github.repository }}
              echo "Updated dev→main PR #$PR_NUMBER title to: $EXPECTED_TITLE"
            else
              echo "PR title already correct: $PR_TITLE"
            fi
          else
            echo "No open dev→main PR found — title update skipped"
          fi
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
